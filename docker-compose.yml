version: '3.7'
services:
  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper

  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LOG_RETENTION_MS=10000  # 10 seconds retention
      - KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS=5000  # Check every 5 seconds
      - KAFKA_CFG_LOG_RETENTION_BYTES=-1  # Disable size-based retention
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true  # Enable topic deletion
      - KAFKA_CFG_LOG_CLEANER_BACKOFF_MS=1000
    volumes:
      - kafka_data:/bitnami/kafka
    depends_on:
      - zookeeper
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local