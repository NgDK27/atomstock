version: '3.7'

networks:
  app-network:
    driver: bridge

services:
  zookeeper:
    image: bitnami/zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - zookeeper_data:/bitnami/zookeeper
    networks:
      - app-network



  kafka:
    image: bitnami/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_ZOOKEEPER_CONNECT=zookeeper:2181
      - ALLOW_PLAINTEXT_LISTENER=yes
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENERS=PLAINTEXT://0.0.0.0:9092
      - KAFKA_CFG_LOG_RETENTION_MS=60000
      - KAFKA_CFG_LOG_RETENTION_CHECK_INTERVAL_MS=5000
      - KAFKA_CFG_LOG_RETENTION_BYTES=-1
      - KAFKA_CFG_DELETE_TOPIC_ENABLE=true
      - KAFKA_CFG_LOG_CLEANER_BACKOFF_MS=1000
      - KAFKA_CFG_NUM_NETWORK_THREADS=16
      - KAFKA_CFG_NUM_IO_THREADS=16
      - KAFKA_CFG_SOCKET_SEND_BUFFER_BYTES=1048576
      - KAFKA_CFG_SOCKET_RECEIVE_BUFFER_BYTES=1048576
      - KAFKA_CFG_SOCKET_REQUEST_MAX_BYTES=209715200
      - KAFKA_CFG_MAX_CONNECTIONS=5000
    volumes:
      - kafka_data:/bitnami/kafka
    depends_on:
      - zookeeper
    networks:
      - app-network

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

volumes:
  zookeeper_data:
    driver: local
  kafka_data:
    driver: local
  redis_data:
    driver: local